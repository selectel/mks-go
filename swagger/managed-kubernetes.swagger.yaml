      type: object
      required:
        - name
        - description
      properties:
        name:
          description: Component name.
          type: string
        description:
          description: Reason explains the purpose of the component.
          type: string
    LogComponentsList:
      description: List of available log components.
      type: object
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/LogComponent'
    OptionNamesAC:
      description: List of available admission controllers.
      type: array
      example:
        - AlwaysPullImages
        - CertificateApproval
        - CertificateSigning
      items:
        type: string
    AvailableAdmissionControllers:
      description: |-
        Detailed info about available admission controllers
        for every k8s minor version.
      type: object
      properties:
        kube_version_minor:
          description: Kubernetes minor version.
          type: string
          example: '1.32'
        names:
          $ref: '#/components/schemas/OptionNamesAC'
    AdmissionControllersList:
      description: List of available admission controllers.
      type: object
      properties:
        admission_controllers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableAdmissionControllers'
    KubeVersion:
      description: Kubernetes version information.
      title: Version view.
      x-go-name: KubeVersionInfo
      type: object
      properties:
        version:
          description: 'Supported Kubernetes version in format: "X.Y.Z"'
          readOnly: true
          type: string
          x-order: 1
        is_default:
          description: Flag indicates whether the Kubernetes version is default.
          readOnly: true
          type: boolean
          x-order: 2
    KubeVersionsList:
      description: List of supported Kubernetes versions.
      type: object
      properties:
        kube_versions:
          type: array
          items:
            $ref: '#/components/schemas/KubeVersion'
    OptionNamesFG:
      description: List of available feature gate names.
      type: array
      items:
        type: string
    AvailableFeatureGates:
      description: |-
        Detailed info about available feature gates
        for every k8s minor version.
      type: object
      properties:
        kube_version_minor:
          description: Kubernetes minor version.
          type: string
        names:
          $ref: '#/components/schemas/OptionNamesFG'
    FeatureGatesList:
      description: List of available feature gates.
      type: object
      properties:
        feature_gates:
          type: array
          items:
            $ref: '#/components/schemas/AvailableFeatureGates'
    ResourceUsage:
      description: Project resource usage.
      properties:
        clusters_count:
          description: Amount of clusters in the project
          format: int64
          type: integer
          example: 2
        nodegroups_count:
          description: Number of node groups in the project.
          format: int64
          type: integer
          example: 5
      type: object
    ClustersLimits:
      required:
        - basic_clusters_limit
        - high_availability_clusters_limit
        - high_availability_multi_az_clusters_limit
      properties:
        basic_clusters_limit:
          description: The minimum number of basic clusters in project.
          type: integer
          example: 10
        high_availability_clusters_limit:
          description: The maximum number of high-availability clusters in project.
          type: integer
          example: 10
        high_availability_multi_az_clusters_limit:
          description: Represents the maximum number of high-availability multi-AZ clusters in project.
          type: integer
          example: 10
      type: object
    ExtendedWorkerNodeLimits:
      properties:
        cpu_drive_coefficient:
          description: |-
            Calculation coefficient for local drives relative to the number of CPUs.
            The final limit will be calculated using the formula: cpu_number * cpu_drive_coefficient
          type: integer
        cpu_ram_coefficient:
          description: |-
            Calculation coefficient for RAM size relative to the number of CPUs.
            The final limit is calculated by the formula: cpu_number * cpu_ram_coefficient
          type: integer
        max_local_drive_gb_per_node:
          description: |-
            Maximum local volume size in gigabytes for each worker node.
            For network volumes, the default limits will be used.
          type: integer
        max_ram_mb_per_node:
          description: Maximum RAM size for each worker node in megabytes.
          type: integer
        min_local_drive_gb_per_node:
          description: |-
            Minimum local volume size in gigabytes for each worker node.
            For network volumes, the default limits will be used.
          type: integer
        min_ram_mb_per_node:
          description: Minimum RAM size in megabytes for each worker node.
          type: integer
      type: object
    NodegroupLimits:
      required:
        - max_nodegroups_per_pool
        - max_nodes_per_nodegroup
        - min_nodes_per_dedicated_nodegroup
        - min_nodes_per_nodegroup
      properties:
        max_nodegroups_per_pool:
          description: Maximum number of nodegroups in the pool.
          type: integer
          example: 100
        max_nodes_per_nodegroup:
          description: The maximum number of nodes in nodegroup.
          type: integer
          example: 15
        min_nodes_per_dedicated_nodegroup:
          description: The minimum number of nodes in dedicated nodegroup.
          type: integer
          example: 1
        min_nodes_per_nodegroup:
          description: The minimum number of nodes in nodegroup.
          type: integer
          example: 0
      type: object
    WorkerNodeLimits:
      required:
        - max_cpus_per_node
        - max_ram_mb_per_node
        - max_volume_gb_per_node
        - min_cpus_per_node
        - min_ram_mb_per_node
        - min_volume_gb_per_node
      properties:
        max_cpus_per_node:
          description: The maximum number of CPUs for each worker node.
          type: integer
          example: 32
        max_ram_mb_per_node:
          description: Maximum RAM size in megabytes for each worker node.
          type: integer
          example: 262144
        max_volume_gb_per_node:
          description: Maximum volume size in gigabytes for each worker node.
          type: integer
          example: 1230
        min_cpus_per_node:
          description: The minimum number of CPUs for each worker node.
          type: integer
          example: 1
        min_ram_mb_per_node:
          description: Minimum RAM size in megabytes for each worker node.
          type: integer
          example: 1024
        min_volume_gb_per_node:
          description: Minimum volume size in gigabytes for each worker node.
          type: integer
          example: 20
      type: object
    LimitsList:
      description: Default limits list
      required:
        - cluster
        - nodegroup
        - worker_node
      properties:
        cluster:
          $ref: '#/components/schemas/ClustersLimits'
        extended_limits:
          additionalProperties:
            $ref: '#/components/schemas/ExtendedWorkerNodeLimits'
          description: Flexible limits rules.
          type: object
          example:
            cpus_equal_to_32:
              min_ram_mb_per_node: 65536
              max_ram_mb_per_node: 262144
              min_local_drive_gb_per_node: 1024
              max_local_drive_gb_per_node: 1230
            cpus_less_than_9:
              min_ram_mb_per_node: 4096
              max_ram_mb_per_node: 262144
              max_local_drive_gb_per_node: 1230
            cpus_more_or_equal_to_9:
              max_ram_mb_per_node: 262144
              max_local_drive_gb_per_node: 1230
              cpu_drive_coefficient: 32
              cpu_ram_coefficient: 2048
        nodegroup:
          $ref: '#/components/schemas/NodegroupLimits'
        worker_node:
          $ref: '#/components/schemas/WorkerNodeLimits'
      type: object
  parameters:
    cluster_id:
      description: Unique cluster identifier.
      in: path
      name: cluster_id
      required: true
      schema:
        type: string
      example: 526338B6-1100-4FB3-AD09-5CD268E5E674
    lang:
      description: Language on which response should be returned.
      in: query
      name: lang
      schema:
        type: string
        enum:
          - ru
          - en
        default: en
    limit:
      description: Limit of elements in response.
      in: query
      name: limit
      schema:
        type: integer
        format: uint64
    offset:
      description: Number of elements to skip.
      in: query
      name: offset
      schema:
        type: integer
        format: uint64
        default: 0
    with_error_details:
      description: Flag to show error details at task view.
      in: query
      name: with_error_details
      schema:
        type: boolean
        default: false
    task_id:
      description: Unique task identifier.
      in: path
      name: task_id
      required: true
      schema:
        type: string
      example: 526338B6-1100-4FB3-AD09-5CD268E5E674
    nodegroup_id:
      description: Unique node group identifier.
      in: path
      name: nodegroup_id
      required: true
      schema:
        type: string
      example: B36D6C34-318D-4EC1-833D-384197F24385
    node_id:
      description: Unique node identifier.
      in: path
      name: node_id
      required: true
      schema:
        type: string
      example: 75A8CD59-2E4B-4C8B-ABF0-379DDC50CCE3
    registry_id:
      description: Unique registry identifier.
      in: path
      name: registry_id
      required: true
      schema:
        type: string
      example: C0523FA7-0BE5-4B9C-9EEA-78EC4CC7204B
    kube_version:
      description: Version of Kubernetes for which response should be returned.
      in: query
      name: kube_version
      schema:
        type: string
      example: 1.33
