openapi: 3.0.0
info:
  title: Managed Kubernetes API
  description: 'Managing clusters, node groups, and nodes: creating a cluster, automating cluster maintenance, and more'
  version: v2.0.0
security:
  - iam_token_project_scoped: []
tags:
  - name: Clusters
    description: 'Managing Kubernetes clusters: create, update, and delete clusters, automate cluster maintenance, and more'
  - name: Node groups
    description: 'Managing node groups in clusters: create, update, delete, resize, automate scaling, and more'
  - name: Nodes
    description: 'Managing nodes in node groups: delete, reinstall, and more'
  - name: Actions
    description: Managing available actions with clusters and node groups
  - name: Tasks
    description: Managing clusters tasks
  - name: Admission Controllers
    description: Managing supported admission controllers
  - name: Feature Gates
    description: Managing supported feature gates
  - name: Kubernetes versions
    description: Managing supported Kubernetes versions
  - name: Registries
    description: Managing registry integrations
  - name: Extras
    description: Managing extra information about resources
  - name: Control Plane Logs
    description: Managing control plane logs collection
paths:
  /v2/clusters:
    get:
      summary: List clusters
      description: Returns a list of clusters.
      operationId: listClustersV2
      tags:
        - Clusters
      responses:
        '200':
          description: List of clusters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    post:
      summary: Create cluster
      description: Starts creating a cluster.
      operationId: createClusterV2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateBody'
        required: true
      tags:
        - Clusters
      responses:
        '201':
          description: Cluster creation has started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResp'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}:
    get:
      summary: Get cluster information
      description: Returns information about a cluster by provided cluster_id.
      operationId: getClusterV2
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      responses:
        '200':
          description: Information about the cluster has been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResp'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    put:
      summary: Update cluster
      description: Updates cluster parameters.
      operationId: updateClusterV2
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateBody'
        required: true
      responses:
        '200':
          description: Cluster updating has started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResp'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    patch:
      summary: Partially update cluster
      description: Updates the selected cluster parameters.
      operationId: patchClusterV2
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateBody'
        required: true
      responses:
        '200':
          description: Cluster updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResp'
        '400':
          description: Invalid request body or path parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '409':
          description: Cluster or node group has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    delete:
      summary: Delete cluster
      description: Deletes a cluster by provided cluster_id.
      operationId: deleteClusterV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Clusters
      responses:
        '204':
          description: Cluster has been successfully deleted.
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/actions:
    get:
      summary: List available cluster actions
      description: Returns available actions for cluster.
      operationId: getClusterActionsV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/lang'
      tags:
        - Clusters
        - Actions
      responses:
        '200':
          description: Information about cluster actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterActionsResp'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/kubeconfig:
    get:
      summary: Get cluster kubeconfig
      description: Returns a kubeconfig in YAML for the requested cluster.
      operationId: getClusterKubeconfigV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Clusters
      responses:
        '200':
          description: Cluster kubeconfig has been returned.
        '403':
          description: Access denied. The user does not have the required member role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/rotate-certs:
    post:
      summary: Rotate cluster certificates
      description: Starts certificates rotation.
      operationId: rotateClusterCertsV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Clusters
      responses:
        '204':
          description: Certificates rotation has started successfully.
        '403':
          description: Access denied. The user does not have the required member role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/upgrade-patch-version:
    post:
      summary: Upgrade cluster patch version
      description: Starts upgrading a Kubernetes patch version.
      operationId: upgradePatchVersionV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Clusters
      responses:
        '200':
          description: Cluster upgrading process has started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResp'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/upgrade-minor-version:
    post:
      summary: Upgrade cluster minor version
      description: Starts upgrading a minor version.
      operationId: upgradeMinorVersionV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Clusters
      responses:
        '200':
          description: Cluster upgrading process has started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResp'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/tasks:
    get:
      summary: List cluster tasks
      description: Returns a list of cluster tasks.
      operationId: listTasksV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/with_error_details'
      tags:
        - Tasks
      responses:
        '200':
          description: Cluster's task list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/tasks/{task_id}:
    get:
      summary: Get cluster task
      description: Returns the cluster task.
      operationId: getTaskV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/task_id'
        - $ref: '#/components/parameters/with_error_details'
      tags:
        - Tasks
      responses:
        '200':
          description: Task information has been returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResp'
        '404':
          description: Cluster or task has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/nodegroups:
    get:
      summary: List nodegroups
      description: Returns a list of node groups of the cluster.
      operationId: listNodegroupsV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Node groups
      responses:
        '200':
          description: List of node groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodegroupList'
        '400':
          description: Invalid path parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    post:
      summary: Create nodegroups
      description: Starts nodegroups creation process.
      operationId: createNodegroupsV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodegroupsCreateBody'
        required: true
      tags:
        - Node groups
      responses:
        '204':
          description: Node groups creation has started successfully.
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of nodegroups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/nodegroups/{nodegroup_id}:
    get:
      summary: Get node group information
      description: Returns information about a node group by the provided `cluster_id` and `nodegroup_id`.
      operationId: getNodegroupV2
      tags:
        - Node groups
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
      responses:
        '200':
          description: Node group information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodegroupResp'
        '400':
          description: Invalid path parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_not_found_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    put:
      summary: Update node group
      description: Updates the node group by the provided `cluster_id` and `nodegroup_id`.
      operationId: putNodegroupV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodegroupUpdateBody'
        required: true
      tags:
        - Node groups
      responses:
        '204':
          description: Node group updating has started successfully.
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of the node groups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    patch:
      summary: Partially update node group
      description: Updates the selected parameters of a node group by the provided `cluster_id` and `nodegroup_id`.
      operationId: patchNodegroupV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodegroupUpdateBody'
        required: true
      tags:
        - Node groups
      responses:
        '204':
          description: Node group updating has started successfully.
        '400':
          description: Invalid request body or path parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of the node groups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    delete:
      summary: Delete nodegroup
      description: Deletes node group by provided cluster_id and nodegroup_id.
      operationId: deleteNodegroupV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
      tags:
        - Node groups
      responses:
        '204':
          description: Node group deletion started successfully.
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of nodegroups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/nodegroups/{nodegroup_id}/resize:
    post:
      summary: Resize nodegroup
      description: Resizes node group by provided cluster_id and nodegroup_id.
      operationId: resizeNodegroupV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodegroupResizeBody'
        required: true
      tags:
        - Node groups
      responses:
        '204':
          description: Node group resize process started successfully.
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of nodegroups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/nodegroups/{nodegroup_id}/actions:
    get:
      summary: List available node group actions
      description: Returns available actions for nodegroup.
      operationId: getNodegroupActionsV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
        - $ref: '#/components/parameters/lang'
      tags:
        - Node groups
        - Actions
      responses:
        '200':
          description: Information about cluster actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodegroupActionsResp'
        '400':
          description: Invalid request body, path, or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster or node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of nodegroups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/nodegroups/{nodegroup_id}/nodes/{node_id}:
    get:
      summary: Get node information
      description: Returns single node by provided cluster_id, nodegroup_id and node_id.
      operationId: getNodeV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
        - $ref: '#/components/parameters/node_id'
      tags:
        - Nodes
      responses:
        '200':
          description: Node information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResp'
        '404':
          description: Cluster, node group or node not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    delete:
      summary: Delete node
      description: Deletes node by provided cluster_id, nodegroup_id and node_id.
      operationId: deleteNodeV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
        - $ref: '#/components/parameters/node_id'
      tags:
        - Nodes
      responses:
        '204':
          description: Node deletion started successfully.
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster, node group or node not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of nodegroups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/nodegroups/{nodegroup_id}/nodes/{node_id}/reinstall:
    post:
      summary: Reinstall node
      description: Reinstalls node by provided cluster_id, nodegroup_id and node_id.
      operationId: reinstallNodeV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - $ref: '#/components/parameters/nodegroup_id'
        - $ref: '#/components/parameters/node_id'
      tags:
        - Nodes
      responses:
        '204':
          description: Node reinstall process started successfully.
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster, node group or node not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '409':
          description: Cluster or one of nodegroups has invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
  /v2/clusters/{cluster_id}/registries:
    post:
      summary: Create registries integration
      description: Create new registries integration in provided cluster
      operationId: createRegistriesV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistriesIntegrationCreateBody'
        required: true
      tags:
        - Registries
      responses:
        '201':
          description: Integrations creation process started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistriesIntegration'
        '400':
          description: Invalid request body or path parameters. Fix the request body and path parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
    get:
      summary: List integrated registries
      description: Get registries integrated with provided cluster
      operationId: getRegistriesV2
      parameters:
        - $ref: '#/components/parameters/cluster_id'
      tags:
        - Registries
      responses:
        '200':
          description: Registries integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistriesIntegration'
        '400':
          description: Invalid request path parameters. Fix the parameters and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '404':
          description: Cluster has not been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
        '500':
          description: Internal server error.
          content:
