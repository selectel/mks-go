components:
  securitySchemes:
    iam_token_project_scoped:
      in: header
      name: X-Auth-Token
      description: IAM token for project
      type: apiKey
  schemas:
    AuditLogs:
      type: object
      required:
        - enabled
        - secret_name
      properties:
        enabled:
          description: |-
            If `true`, Kubernetes audit logs are collected.
            and pushed into the SIEM system (e.g. logstash).
            False by default.
          type: boolean
          example: true
        secret_name:
          description: 'Contains the name of the Kubernetes secret in namespace kube-system with credentials of the SIEM system where logs should be pushed. Fields of the secret: host, port, username (optional), password (optional), ca.crt (optional). This field is optional. By default, used mks-audit-logs is used. Secret name should be as a DNS subdomain name as defined in RFC 1123. [More Information.](https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#dns-subdomain-names)'
          type: string
    OIDC:
      description: OIDC represents parameters to connect client's OIDC provider with Kubernetes.
      required:
        - client_id
        - enabled
        - groups_claim
        - issuer_url
        - provider_name
        - username_claim
        - ca_certs
      type: object
      properties:
        client_id:
          description: Required client id that all tokens must be issued for. Will be placed in `--oidc-client-id` flag. It is required when enabled = true.
          type: string
        enabled:
          description: |-
            If `enabled` OIDC should be turned on in the cluster.
            False by default.
          type: boolean
        groups_claim:
          description: Optional JWT claim to use as the user's group. By default, `groups`. Will be placed in `--oidc-groups-claim` flag.
          type: string
        issuer_url:
          description: URL of the provider that allows the API server to discover public signing keys. Will be placed in `--oidc-issuer-url` flag. It is required when enabled = true.
          type: string
        provider_name:
          description: Custom user defined name of the provider. It is not used in the cluster directly. It is required when enabled = true.
          type: string
        username_claim:
          description: Optional JWT claim to use as the username. By default, `sub`. Will be placed in `--oidc-username-claim` flag.
          type: string
        ca_certs:
          description: |-
            CACerts represent optional custom CA certs chain in X509 PEM format of provider's SSL certificate.
            Will be written to file on masters which will be passed in `--oidc-ca-file` kube-apiserver flag.
          x-omitempty: true
          type: string
        ca_certs_expiration:
          description: CACertsExpiration represents date and time when the first of provided CA certificates will be expired.
          format: date-time
          x-omitempty: true
          type: string
    KubernetesOptions:
      type: object
      required:
        - admission_controllers
        - audit_logs
        - feature_gates
        - oidc
        - x509_ca_certificates
      description: |-
        Additional k8s options such as pod security policy,
        feature gates, etc.
      properties:
        admission_controllers:
          description: Turned on admission controllers for the cluster.
          items:
            type: string
          type: array
        audit_logs:
          $ref: '#/components/schemas/AuditLogs'
        feature_gates:
          description: Turned on feature gates
          items:
            type: string
          type: array
        oidc:
          $ref: '#/components/schemas/OIDC'
        x509_ca_certificates:
          description: Represent custom X509 CA certificates which can be used for cluster components. Certificates should be encoded to base64 format. Note 💡 ``` X509CaCertificates can be disabled for some pools. ```
          x-omitempty: true
          type: string
    Cluster:
      description: Provides information about cluster.
      required:
        - id
        - created_at
        - updated_at
        - name
        - project_id
        - status
        - basic
        - enable_autorepair
        - enable_patch_version_auto_upgrade
        - private_kube_api
        - kube_api_ip
        - subnet_id
        - kube_version
        - network_id
        - network_type
        - pool
        - kubernetes_options
        - cni_type
        - cluster_type
      type: object
      properties:
        id:
          description: Unique identifier of the cluster.
          type: string
          format: uuid4
          example: 5C2B9606-F7FA-4468-AD98-E389D5334CBA
        created_at:
          description: Timestamp in UTC timezone of when the cluster has been created.
          type: string
          format: date-time
          example: '2019-11-04T10:21:11.943917Z'
        updated_at:
          description: Timestamp in UTC timezone of when the cluster has been updated.
          format: date-time
          type: string
          example: '2019-11-04T10:21:11.943917Z'
        name:
          description: The name of the cluster.
          type: string
          example: super-mks-cluster
        project_id:
          description: Contains reference to the project of the cluster.
          type: string
          example: 8D226B33-3897-4223-AAAF-A83D49C5399E
        status:
          description: Current status of the cluster.
          type: string
          enum:
            - ACTIVE
            - ERROR
            - DELETED
            - CREATING
          example: ACTIVE
        basic:
          description: Specifies that cluster has only a single master and that control plane is not in highly available mode.
          type: boolean
          example: true
        enable_autorepair:
          description: Reflects whether worker nodes are allowed to be reinstalled automatically in case of their unavailability or unhealthiness.
          type: boolean
          example: true
        enable_patch_version_auto_upgrade:
          description: Specifies whether the Kubernetes version of the cluster is allowed to be upgraded automatically.
          type: boolean
          example: true
        private_kube_api:
          description: Whether kube API is available from the Internet or not.
          type: boolean
          example: true
        kube_api_ip:
          description: The IP of the Kubernetes API.
          type: string
          example: 10.10.1.1
        subnet_id:
          description: Contains reference to the subnet of the cluster.
          format: uuid4
          type: string
          example: 0FAB540C-1099-4A4A-AD6C-C1498BE74E0A
        kube_version:
          description: The current Kubernetes version of the cluster.
          type: string
          example: 1.32
        network_id:
          description: Contains reference to the network of the cluster.
          format: uuid4
          type: string
          example: EE102156-A9A8-423A-811D-F8E3C56891B7
        network_type:
          description: Type of network l3vpn or default.
          type: string
          enum:
            - STANDARD
            - L3VPN
        pool:
          description: Pool represents the pool where the cluster master nodes are located.
          type: string
          example: ru-9
        kubernetes_options:
          $ref: '#/components/schemas/KubernetesOptions'
        cni_type:
          description: CNI type represents type of CNI which is used in cluster.
          type: string
          enum:
            - CALICO
            - CILIUM
        cluster_type:
          description: The type of the cluster.
          type: string
          enum:
            - BASIC
            - HIGH_AVAILABILITY
            - HIGH_AVAILABILITY_MULTI_AZ
    ClusterList:
      description: List of clusters.
      type: object
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
    generic_error:
      description: Generic Error.
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              description: Error Message.
              type: string
              example: Some error occurred
          required:
            - message
      required:
        - error
    CNICiliumSettings:
      type: object
      description: |-
        Settings for Cilium CNI if this CNI was chosen as "cni_type".
        Otherwise settings will be ignored.
      properties:
        hubble_relay:
          description: Enables hubble relay for Cilium CNI.
          type: boolean
          default: true
        envoy_daemonset:
          description: Enables Envoy DaemonSet for Cilium CNI.
          type: boolean
          default: true
    ClusterCreateStruct:
      properties:
        basic:
          description: |-
            Basic specifies that only a single zonal master will be created.
            It is needed if a highly available control plane is not required.
            False by default.
          type: boolean
        cloud_subnet_cidr:
          x-omitempty: true
          type: string
        enable_patch_version_auto_upgrade:
          description: |-
            EnablePatchVersionAutoUpgrade specifies whether the Kubernetes version of the cluster is allowed to be upgraded
            automatically.
            Enabled by default for regional clusters and disabled for zonal clusters.
          type: boolean
        enable_autorepair:
          description: EnableAutorepair reflects whether worker nodes are allowed to be reinstalled  automatically in case of their unavailability or unhealthiness.
          type: boolean
          default: true
        kube_version:
          description: |-
            KubeVersion represents the needed Kubernetes version of the cluster.
            It should be in x.y.z format.
          type: string
        kubernetes_options:
          $ref: '#/components/schemas/KubernetesOptions'
        maintenance_window_start:
          description: |-
            MaintenanceWindowStart represents UTC time of when the cluster will start its maintenance tasks.
            It should be in hh:mm:ss format if provided.
          type: string
        name:
          description: |-
            Name represents the desired name of the cluster.
            It must not exceed 32 characters and can contain Latin letters,
            with digits and hyphens. Must start with a letter or a digit.
          type: string
        network_id:
          description: |-
            NetworkID contains a reference to the network of the cluster.
            It can be set in cases where the network is pre-created.
          format: uuid4
          type: string
        network_type:
          description: |-
            NetworkType indicates which network will be used for master-node
            connection.
          type: string
        pool:
          description: Pool where the cluster master nodes are located.
          type: string
        private_kube_api:
          description: |-
            PrivateKubeAPI specifies whether kube API should be available from the Internet or not.
            False by default.
          type: boolean
        subnet_id:
          description: |-
            SubnetID contains a reference to the subnet of the cluster.
            It can be set in cases where the subnet is pre-created.
          format: uuid4
          type: string
        cni_type:
          description: |-
            CNI type represents type of CNI which will be used in cluster.
            Supported CNI types are CALICO and CILIUM. CALICO by default.
          type: string
        cluster_type:
          description: |-
            The type of the cluster. If not specified,
            defaults based on the 'basic' field: basic=true → BASIC,
            basic=false → HIGH_AVAILABILITY. For HIGH_AVAILABILITY_MULTI_AZ
            clusters this field is required.
          type: string
          enum:
            - BASIC
            - HIGH_AVAILABILITY
            - HIGH_AVAILABILITY_MULTI_AZ
        cni_cilium_settings:
          $ref: '#/components/schemas/CNICiliumSettings'
      required:
        - name
        - network_id
        - subnet_id
        - kube_version
        - private_kube_api
        - pool
        - network_type
        - maintenance_window_start
        - cloud_subnet_cidr
        - basic
      type: object
    ClusterCreateBody:
      description: |-
        ClusterCreateBody
        represents body content.
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterCreateStruct'
    ClusterDetailed:
      description: Provides detailed information about cluster.
      required:
        - id
        - created_at
        - updated_at
        - name
        - project_id
        - status
        - basic
        - enable_autorepair
        - enable_patch_version_auto_upgrade
        - private_kube_api
        - kube_api_ip
        - subnet_id
        - kube_version
        - network_id
        - network_type
        - pool
        - kubernetes_options
        - maintenance_last_start
        - maintenance_window_end
        - maintenance_window_start
        - pki_tree_updated_at
        - cni_type
        - cluster_type
      type: object
