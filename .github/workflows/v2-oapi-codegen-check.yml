name: Check oapi-codegen v2
on:
  push:
    branches:
      - sdk-v2    
  pull_request:

jobs:
  oapi-check:
    name: check-oapi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.25.9'
          
      - name: Check oapi-codegen
        run: make ci-check-oapi
