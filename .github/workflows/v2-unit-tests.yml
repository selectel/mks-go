name: Unit Tests v2
on:
  push:
    branches:
      - sdk-v2
  pull_request:

jobs:
  unit-test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.25.9'

      - name: Check mockery relevance
        run: make ci-check-mocks

      - name: Run test
        run: make unittest
